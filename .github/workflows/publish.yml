name: publish

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Docker image to use as base name for tags.
        required: true
        type: string
      build-cache:
        description: >-
          Use cache when building the image.
        required: false
        type: string
        default: 'true'
      version:
        description: >-
          Python version to release.
        required: true
        type: string
      variant:
        description: >-
          Image variant.
        required: true
        type: string
      tags:
        description: >-
          List of tags as key-value pair attributes.
        required: false
        type: string
      username:
        description: >-
          Username for authenticating to the Docker registry.
        required: true
        type: string
    secrets:
      password:
        description: >-
          Password or personal access token for authenticating the Docker registry.
        required: true

jobs:
  build:
    runs-on: ${{ matrix.builder.runner-image }}
    strategy:
      fail-fast: false
      matrix:
        builder:
          - runner-image: ubuntu-24.04
            platform: linux/amd64
          - runner-image: blacksmith-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.builder.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.username }}
          password: ${{ secrets.password }}

      - name: Build and push by digest (cached)
        if: ${{ inputs.build-cache == 'true' }}
        id: build-cache
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ inputs.version }}-${{ inputs.variant }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ inputs.version }}-${{ inputs.variant }}-${{ env.PLATFORM_PAIR }},mode=max
          file: ${{ inputs.version }}/${{ inputs.variant }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.builder.platform }}

      - name: Build and push by digest (no cache)
        if: ${{ inputs.build-cache != 'true' }}
        id: build-no-cache
        uses: docker/build-push-action@v6
        with:
          file: ${{ inputs.version }}/${{ inputs.variant }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.builder.platform }}

      - name: Export digest (cached)
        if: ${{ inputs.build-cache == 'true' }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-cache.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Export digest (no cache)
        if: ${{ inputs.build-cache == 'false' }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build-no-cache.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ inputs.version }}-${{ inputs.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.version }}-${{ inputs.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.image }}
          tags: |
            ${{ inputs.tags }}

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.username }}
          password: ${{ secrets.password }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.image }}:${{ steps.meta.outputs.version }}
